js:
  original: |-
    import FormattedText from '@/lib/FormattedText';

    const Book1FeatureCard = ({ title, body, label, link_label, link_url, theme }) => {
      const isDark = theme !== 'light';
      const bg = isDark ? '#0f0f0f' : '#f5f4f0';
      const titleColor = isDark ? '#fff' : '#111';
      const bodyColor = isDark ? '#777' : '#555';
      const mutedColor = isDark ? '#444' : '#aaa';
      const borderColor = isDark ? '#1e1e1e' : '#e0e0e0';

      return (
        <div style={{
          background: bg,
          border: `1px solid ${borderColor}`,
          padding: '60px',
          display: 'flex',
          flexDirection: 'column',
          gap: '24px',
          maxWidth: '700px',
        }}>
          {label && (
            <p style={{
              color: mutedColor, fontSize: '11px', letterSpacing: '5px',
              textTransform: 'uppercase', fontFamily: 'monospace',
            }}>
              {label}
            </p>
          )}
          <h2 style={{
            color: titleColor, fontSize: 'clamp(28px, 4vw, 48px)',
            fontWeight: '600', lineHeight: '1.15', letterSpacing: '-1px',
          }}>
            {title ? <FormattedText>{title}</FormattedText> : ''}
          </h2>
          {body && (
            <div style={{ color: bodyColor, fontSize: '17px', lineHeight: '1.8' }}>
              <FormattedText>{body}</FormattedText>
            </div>
          )}
          {link_label && (
            <a href={link_url || '#'} style={{
              color: titleColor, fontSize: '12px', letterSpacing: '3px',
              textTransform: 'uppercase', textDecoration: 'none',
              borderBottom: `1px solid ${mutedColor}`, paddingBottom: '2px',
              alignSelf: 'flex-start', marginTop: '8px',
            }}>
              {link_label} →
            </a>
          )}
        </div>
      );
    };

    export default Book1FeatureCard;
