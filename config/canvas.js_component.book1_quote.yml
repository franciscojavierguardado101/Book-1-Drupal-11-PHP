js:
  original: |-
    import FormattedText from '@/lib/FormattedText';

    const Book1Quote = ({ quote, attribution, chapter, theme }) => {
      const isDark = theme !== 'light';
      const bg = isDark ? '#0a0a0a' : '#f9f8f4';
      const quoteColor = isDark ? '#e8e8e8' : '#111';
      const mutedColor = isDark ? '#444' : '#bbb';
      const accentColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.03)';

      return (
        <section style={{
          background: bg,
          padding: '100px 40px',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          position: 'relative',
          overflow: 'hidden',
        }}>
          <div style={{
            position: 'absolute',
            top: '-20px',
            left: '50%',
            transform: 'translateX(-50%)',
            fontSize: '260px',
            lineHeight: '1',
            color: accentColor,
            fontFamily: 'Georgia, serif',
            userSelect: 'none',
            pointerEvents: 'none',
          }}>
            &ldquo;
          </div>
          <div style={{ maxWidth: '800px', textAlign: 'center', position: 'relative' }}>
            {chapter && (
              <p style={{
                color: mutedColor,
                fontSize: '11px',
                letterSpacing: '5px',
                textTransform: 'uppercase',
                fontFamily: 'monospace',
                marginBottom: '40px',
              }}>
                {chapter}
              </p>
            )}
            <blockquote style={{
              color: quoteColor,
              fontSize: 'clamp(22px, 3.5vw, 38px)',
              fontStyle: 'italic',
              fontFamily: 'Georgia, "Times New Roman", serif',
              lineHeight: '1.65',
              letterSpacing: '-0.5px',
              margin: '0 0 40px',
            }}>
              {quote ? <FormattedText>{quote}</FormattedText> : ''}
            </blockquote>
            {attribution && (
              <p style={{
                color: mutedColor,
                fontSize: '12px',
                letterSpacing: '4px',
                textTransform: 'uppercase',
                fontFamily: 'monospace',
              }}>
                &mdash; {attribution}
              </p>
            )}
          </div>
        </section>
      );
    };

    export default Book1Quote;
