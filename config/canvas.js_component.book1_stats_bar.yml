js:
  original: |-
    const Book1StatsBar = ({
      stat1_value, stat1_label,
      stat2_value, stat2_label,
      stat3_value, stat3_label,
      stat4_value, stat4_label,
      theme,
    }) => {
      const isDark = theme !== 'light';
      const bg = isDark ? '#0f0f0f' : '#f5f4f0';
      const valueColor = isDark ? '#ffffff' : '#111';
      const labelColor = isDark ? '#444' : '#aaa';
      const borderColor = isDark ? '#1a1a1a' : '#e5e5e5';

      const stats = [
        { value: stat1_value, label: stat1_label },
        { value: stat2_value, label: stat2_label },
        { value: stat3_value, label: stat3_label },
        { value: stat4_value, label: stat4_label },
      ].filter(s => s.value);

      if (!stats.length) return null;

      return (
        <section style={{
          background: bg,
          borderTop: `1px solid ${borderColor}`,
          borderBottom: `1px solid ${borderColor}`,
          padding: '60px 40px',
        }}>
          <div style={{
            maxWidth: '1200px',
            margin: '0 auto',
            display: 'grid',
            gridTemplateColumns: `repeat(${stats.length}, 1fr)`,
          }}>
            {stats.map((stat, i) => (
              <div key={i} style={{
                padding: '40px',
                textAlign: 'center',
                borderRight: i < stats.length - 1 ? `1px solid ${borderColor}` : 'none',
              }}>
                <div style={{
                  color: valueColor,
                  fontSize: 'clamp(40px, 6vw, 72px)',
                  fontWeight: '300',
                  letterSpacing: '-3px',
                  lineHeight: '1',
                  marginBottom: '16px',
                }}>
                  {stat.value}
                </div>
                <div style={{
                  color: labelColor,
                  fontSize: '11px',
                  letterSpacing: '4px',
                  textTransform: 'uppercase',
                  fontFamily: 'monospace',
                }}>
                  {stat.label}
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    };

    export default Book1StatsBar;
