js:
  original: |-
    import FormattedText from '@/lib/FormattedText';

    const MoonboundArticle = ({ heroImage, title, eventDate, eventTime, timezone, description, tag }) => (
      <article style={{ background: '#0a0a0a', minHeight: '100vh', fontFamily: 'Georgia, serif' }}>

        {/* Hero */}
        <figure style={{ margin: 0, position: 'relative', width: '100%', height: '480px', overflow: 'hidden' }}>
          {heroImage?.src
            ? <img src={heroImage.src} alt={heroImage.alt || ''} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
            : <div style={{ width: '100%', height: '100%', background: '#111' }} />}
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, transparent 40%, rgba(10,10,10,0.9) 100%)' }} />
          {tag && (
            <p style={{ position: 'absolute', top: '32px', left: '48px', margin: 0,
              color: '#fc3d21', fontSize: '11px', letterSpacing: '4px',
              textTransform: 'uppercase', fontFamily: 'monospace' }}>{tag}</p>
          )}
        </figure>

        {/* Body */}
        <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '64px 48px' }}>
          <div style={{ display: 'flex', gap: '64px', alignItems: 'flex-start' }}>

            {/* Left: title + description */}
            <div style={{ flex: '1 1 0', minWidth: 0 }}>
              {title && (
                <h1 style={{ color: '#f0f0f0', fontSize: 'clamp(28px, 4vw, 52px)',
                  fontWeight: '400', fontStyle: 'italic', lineHeight: '1.2',
                  margin: '0 0 40px', letterSpacing: '-0.5px' }}>{title}</h1>
              )}
              {description && (
                <div style={{ color: '#bbb', fontSize: '17px', lineHeight: '1.8', maxWidth: '660px' }}>
                  <FormattedText>{description}</FormattedText>
                </div>
              )}
            </div>

            {/* Right: details table */}
            {(eventDate || eventTime || timezone) && (
              <aside style={{ flexShrink: 0, width: '260px', borderLeft: '1px solid #2a2a2a', paddingLeft: '40px' }}>
                <p style={{ color: '#555', fontSize: '10px', letterSpacing: '4px',
                  textTransform: 'uppercase', fontFamily: 'monospace', margin: '0 0 24px' }}>Details</p>
                <dl style={{ margin: 0 }}>
                  {eventDate && <>
                    <dt style={{ color: '#555', fontSize: '10px', letterSpacing: '3px',
                      textTransform: 'uppercase', fontFamily: 'monospace', margin: '0 0 4px' }}>Date</dt>
                    <dd style={{ color: '#e0e0e0', fontSize: '15px', margin: '0 0 24px',
                      fontFamily: 'monospace' }}>{eventDate}</dd>
                  </>}
                  {eventTime && <>
                    <dt style={{ color: '#555', fontSize: '10px', letterSpacing: '3px',
                      textTransform: 'uppercase', fontFamily: 'monospace', margin: '0 0 4px' }}>Time</dt>
                    <dd style={{ color: '#e0e0e0', fontSize: '15px', margin: '0 0 24px',
                      fontFamily: 'monospace' }}>{eventTime}</dd>
                  </>}
                  {timezone && <>
                    <dt style={{ color: '#555', fontSize: '10px', letterSpacing: '3px',
                      textTransform: 'uppercase', fontFamily: 'monospace', margin: '0 0 4px' }}>Timezone</dt>
                    <dd style={{ color: '#e0e0e0', fontSize: '15px', margin: 0,
                      fontFamily: 'monospace' }}>{timezone}</dd>
                  </>}
                </dl>
              </aside>
            )}

          </div>
        </div>
      </article>
    );

    export default MoonboundArticle;
