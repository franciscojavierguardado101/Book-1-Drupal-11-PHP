js:
  original: |-
    const MoonboundHero = ({ bgImage, logoImage, eyebrow, description, ctaLabel, ctaUrl }) => (
      <section style={{
        backgroundImage: bgImage?.src ? `url(${bgImage.src})` : 'none',
        backgroundColor: '#111', backgroundSize: 'cover',
        backgroundPosition: 'center right', minHeight: '520px',
        display: 'flex', alignItems: 'center', padding: '60px 48px', position: 'relative'
      }}>
        <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none',
          background: 'linear-gradient(to right, rgba(0,0,0,0.88) 35%, rgba(0,0,0,0.3) 65%, transparent 100%)' }} />
        <div style={{ position: 'relative', zIndex: 1, maxWidth: '520px' }}>
          {logoImage?.src && <img src={logoImage.src} alt={logoImage.alt || ''}
            style={{ display: 'block', maxWidth: '300px', width: '100%', marginBottom: '12px' }} />}
          {eyebrow && <p style={{ color: '#aaa', fontSize: '12px', letterSpacing: '5px',
            textTransform: 'uppercase', marginBottom: '20px', fontFamily: 'monospace' }}>{eyebrow}</p>}
          {description && <p style={{ color: '#e8e8e8', fontSize: '16px', lineHeight: '1.75',
            marginBottom: '36px', maxWidth: '460px' }}>{description}</p>}
          {ctaLabel && <a href={ctaUrl || '#'} style={{ display: 'inline-block',
            background: '#fc3d21', color: '#fff', fontWeight: '700', fontSize: '13px',
            letterSpacing: '2px', textTransform: 'uppercase', padding: '13px 32px',
            textDecoration: 'none' }}>{ctaLabel}</a>}
        </div>
      </section>
    );

    export default MoonboundHero;
