  original: |-
    const TeaserItem = ({ thumbnail, duration, title, excerpt, url, date, tag }) => (
      <article style={{
        display: 'var(--tl-art-display, block)',
        width: 'var(--tl-art-w, 100%)',
        maxWidth: 'var(--tl-art-max-w, none)',
        marginLeft: 'var(--tl-art-ml, auto)',
        marginRight: 'var(--tl-art-mr, auto)',
        marginBottom: 'var(--tl-art-mb, 0)',
        padding: 'var(--tl-art-p, 0)',
        verticalAlign: 'var(--tl-art-vt, top)',
        background: 'var(--tl-bg, #1a1a1a)',
        borderBottom: 'var(--tl-border-b, 1px solid #2a2a2a)',
        boxSizing: 'border-box',
      }}>
        <a href={url || '#'} style={{
          display: 'flex',
          flexDirection: 'var(--tl-flex, column)',
          textDecoration: 'none',
          alignItems: 'flex-start',
          padding: 'var(--tl-a-pad, 0)',
        }}>
          <figure style={{
            margin: 0, position: 'relative', flexShrink: 0,
            width: 'var(--tl-thumb-w, 100%)',
            height: 'var(--tl-thumb-h, 180px)',
            overflow: 'hidden',
            backgroundImage: thumbnail?.src ? `url(${thumbnail.src})` : 'none',
            backgroundColor: '#0a0a0a', backgroundSize: 'cover', backgroundPosition: 'center',
          }}>
            {duration && <p style={{ position: 'absolute', bottom: '8px', left: '8px', margin: 0,
              color: '#fff', fontSize: '10px', fontFamily: 'monospace', letterSpacing: '1px',
              background: 'rgba(0,0,0,0.65)', padding: '2px 6px' }}>{duration}</p>}
          </figure>
          <div style={{ padding: 'var(--tl-pad, 16px)', flex: 1, minWidth: 0 }}>
            {title && <h4 style={{ color: '#fff', fontSize: '15px', fontWeight: '500',
              margin: '0 0 8px', lineHeight: '1.4', fontFamily: 'monospace' }}>{title}</h4>}
            {excerpt && <p style={{ color: '#999', fontSize: '13px', lineHeight: '1.6',
              margin: '0 0 12px' }}>{excerpt}</p>}
            <div style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
              {date && <span style={{ color: '#666', fontSize: '11px', fontFamily: 'monospace' }}>{date}</span>}
              {tag && <span style={{ color: '#aaa', fontSize: '10px', letterSpacing: '2px',
                textTransform: 'uppercase', fontFamily: 'monospace' }}>{tag}</span>}
            </div>
          </div>
        </a>
      </article>
    );

    export default TeaserItem;
