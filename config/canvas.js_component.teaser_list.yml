js:
  original: |-
    import { useState, useEffect } from 'react';

    const TeaserList = ({ sectionTitle, slots }) => {
      const [view, setView] = useState('list');

      useEffect(() => {
        const r = document.documentElement;
        if (view === 'list') {
          r.style.setProperty('--tl-art-display', 'block');
          r.style.setProperty('--tl-art-w', '100%');
          r.style.setProperty('--tl-art-max-w', '1200px');
          r.style.setProperty('--tl-art-ml', 'auto');
          r.style.setProperty('--tl-art-mr', 'auto');
          r.style.setProperty('--tl-art-mb', '0');
          r.style.setProperty('--tl-art-p', '0');
          r.style.setProperty('--tl-art-vt', 'top');
          r.style.setProperty('--tl-bg', 'transparent');
          r.style.setProperty('--tl-flex', 'row');
          r.style.setProperty('--tl-thumb-w', '280px');
          r.style.setProperty('--tl-thumb-h', '157px');
          r.style.setProperty('--tl-pad', '0 0 0 24px');
          r.style.setProperty('--tl-a-pad', '20px 0');
          r.style.setProperty('--tl-border-b', '1px solid #2a2a2a');
        } else {                                    
          r.style.setProperty('--tl-art-display', 'inline-block');                                                                               
          r.style.setProperty('--tl-art-w', '32%');                                                                                              
          r.style.setProperty('--tl-art-max-w', 'none');                                                                                         
          r.style.setProperty('--tl-art-ml', '40px');       // ← was 0, now adds left offset                                                     
          r.style.setProperty('--tl-art-mr', '0');                                                                                               
          r.style.setProperty('--tl-art-mb', '24px');                                                                                            
          r.style.setProperty('--tl-art-p', '0');           // ← was 8px, removes card padding                                                   
          r.style.setProperty('--tl-art-vt', 'top');                                                                                             
          r.style.setProperty('--tl-bg', 'transparent');    // ← was #1a1a1a, removes gray box                                                   
          r.style.setProperty('--tl-border-b', 'none');     // ← NEW, kills the border line                                                      
          r.style.setProperty('--tl-flex', 'column');                                                                                            
          r.style.setProperty('--tl-thumb-w', '100%');                                                                                           
          r.style.setProperty('--tl-thumb-h', '240px');     // ← was 180px, taller images                                                        
          r.style.setProperty('--tl-pad', '12px 0 0 0');                                                                                         
          r.style.setProperty('--tl-a-pad', '0');                                                                                                
        }  
      }, [view]);

      const btnBase = { background: 'none', border: '1px solid #444', color: '#aaa',
        cursor: 'pointer', padding: '6px 12px', fontSize: '11px', fontFamily: 'monospace', letterSpacing: '1px' };
      const btnActive = { ...btnBase, borderColor: '#fff', background: '#fff', color: '#000' };

      return (
        <section style={{ backgroundColor: '#111', padding: '48px 40px' }}>
          <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
              {sectionTitle && <p style={{ color: '#666', fontSize: '11px', letterSpacing: '4px',
                textTransform: 'uppercase', fontFamily: 'monospace', margin: 0 }}>{sectionTitle}</p>}
              <div style={{ display: 'flex', gap: '8px', marginLeft: 'auto' }}>
                <button style={view === 'list' ? btnActive : btnBase} onClick={() => setView('list')}>☰ List</button>
                <button style={view === 'grid' ? btnActive : btnBase} onClick={() => setView('grid')}>⊞ Grid</button>
              </div>
            </div>
          </div>
          <div>{slots?.items}</div>
        </section>
      );
    };

    export default TeaserList;
